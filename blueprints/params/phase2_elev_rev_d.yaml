  change_rev_b: "official Trojan Horse Arena mark on the portal above the arch + TROJAN HORSE ARENA wordmark; side panel 'Hazel Green Regional Athletic Complex'; keystone replaced by the mark; portal FREESTANDING in front of the south entrance over the brick Champion Walk (6:22 AM CT); key plan"
