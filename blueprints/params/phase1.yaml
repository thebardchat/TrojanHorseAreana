work_items:
  - id: W1
    name: Wall padding
    description: proper training wall pads on the wrestling room walls; finish work, not new construction
    walls: TBD
    why: "Wrestlers can get hurt when they are thrown or fall into bare, unpadded walls during practice. Proper wall pads lower that risk."
    pad_height: 6 ft
    pad_thickness: TBD
    fire_rating: TBD    # must meet standards.wall_pads.spec_basis (R-001)
