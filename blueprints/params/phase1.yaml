work_items:
  - id: W1
    name: Wall padding
    priority: 3
    priority_note: can run in parallel; does not depend on water
    description: proper training wall pads on the wrestling room walls; finish work, not new construction
    walls: TBD
    why: "Wrestlers can get hurt when they are thrown or fall into bare, unpadded walls during practice. Proper wall pads lower that risk."
    pad_height: 6 ft
    pad_thickness: TBD
    fire_rating: TBD    # must meet standards.wall_pads.spec_basis (R-001)
    supplied_by: TBD    # school purchase, donated, or fundraised
    supplied_by_options: school purchase, donation, or fundraiser
    purchase_note: "Wall pads must have an NFPA 286 assembly test report — not a foam-only rating. Ask the vendor before purchase."
    pad_estimate:       # Shane's ESTIMATE, not a takeoff. Replaces the 10:06 PM estimate. Assumes all 4 walls (which walls is still OPEN, D-021).
      wall_length_lf_gross: 200      # 2 x (55 + 45), inside perimeter
      door_deduction_lf: 12          # 4 doors x 3 ft (ASSUMED standard doors)
      padded_wall_lf_approx: 188     # 200 - 12
      panel_size: 2 ft x 6 ft
      panel_count_approx: 94         # 188 x 6 / 12
      pad_area_sf_calc: 1128         # 188 x 6, calculated by KEYSTONE (not on the sheet)
      pad_height_note: 6'-0" pads under a 10'-0" ceiling
      assumes: all 4 walls padded
      math_check: "2 x (55 + 45) = 200; 200 - 4 x 3 = 188 LF; 188 x 6 / 12 = 94 panels. KEYSTONE checked: correct."
      superseded: "10:06 PM estimate ~200 LF / ~1,200 SF / ~100 panels before door deductions (never shown to Shane on a sheet)"
      sheet_line: "~188 LF of padded wall after 4 doors (~94 panels at 2 ft x 6 ft); 6'-0\" pads under a 10'-0\" ceiling. Estimate assumes all 4 walls."
      source: "Shane estimate 2026-10-03 10:12 PM CT (tape 55 x 45 ft, 4 doors at 3 ft ASSUMED, pad height 6 ft per D-003, ceiling 10 ft); math checked by KEYSTONE"
    source: "concept sheet; priority → D-024 (Shane, firsthand 2026-10-03); pad_height → D-003 DECIDED (Shane, chat 2026-10-03; matches R-001 guidance); walls/supplier → D-021 (OPEN); why → Shane 2026-10-03; purchase_note verbatim → D-020 (Shane, chat 2026-10-03); fire rule in standards.wall_pads (R-001); product choice still TBD"
  - id: W2
    name: Restore water / plumbing repair
    priority: 1
    status: "No running water to the area. All fixtures out of service. Cause unknown."
    status_detail: showers, toilets, and sinks are all non-functional, not just leaking
    location: support wing east of the wrestling room, along the open hallway
    cause: TBD          # plumber to diagnose: shutoff, supply line, or other
    scope: restore running water to the area and repair the plumbing so the fixtures work again
    why: "Athletes have no working restroom or handwashing during practice; hygiene matters in a contact sport."
    design_by: BY LICENSED PLUMBER / ENGINEER OF RECORD
    keystone_output: scope narrative + fixture list only (no plumbing design)
    source: "Shane, firsthand 2026-10-03 (status, status_detail, why, rename, priority → D-024; location added 10:06 PM CT); concept sheet (original scope); Shane (prompt §2: design_by, keystone_output); cause → D-002"
  - id: W3
    name: Restroom split
    priority: 2
    result: 1 male + 1 female athlete restroom
    ada_compliance: full 2010 ADA Standards, BOTH rooms
    reason: the route to the training room is an open walk-through room
    restroom_type: single-user, one per sex
    accessibility_minimums: see standards.ada_single_user_restroom (R-003)
    location: support wing
    location_note: waiting on support wing measurements
    source: "location, location_note → Shane 2026-10-03 10:12 PM CT (wrestling room measured; restrooms in support wing, rooms TBD); concept sheet (result, reason); priority → D-024 (Shane, firsthand 2026-10-03); restroom_type + ada_compliance → D-019 (Shane, chat 2026-10-03); location → D-001, D-002; accessibility minimums in standards.ada_single_user_restroom (R-003)"

