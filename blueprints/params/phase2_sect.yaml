  source: "Shane 2026-10-04 6:45 AM CT ('P2-A-301 Rev A building sections: at least one N-S and one E-W through the bowl / event floor and the Level 2 loop; locked / assumed heights; telescopic lower / fixed upper; 70 in stairs; sight lines TBD')"

