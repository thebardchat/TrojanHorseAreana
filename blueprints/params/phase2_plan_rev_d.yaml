# joining the rear walkway (N), walkway (E) and upper concourse / hall of champions balcony (S); the missing leg is on the WEST,
# along the arena-side edge of S&C (17) and cross-training (18), which are trimmed to fit. Loop = 2 lanes x 42 in = 7 ft
# everywhere (the east walkway was already 7 ft), squared corners. To clear the loop: ST-1 moves 3.55 ft west, ST-2 moves
# 5 ft north into a 19 x 5 ft stair-tower projection at the NE corner, the elevator moves 1 ft south (all kept aligned L1 / L2).
# Units: feet. Origin = SW corner of the building; x runs east, y runs north. Rectangles are [x0, y0, x1, y1].
# Status: every coordinate is ASSUMED (KEYSTONE layout choice, LOW confidence) unless a field says otherwise.

