      source: "Shane 2026-10-04 7:44 AM CT (D-053); phase2_plan_rev_e.yaml; phase2_sect.yaml rev_c"
    rev_d:
      label: "REV D BASIS (superseded)"
      short: "Rev D"
      lower_rise_in: 11.625
      upper_rise_in: 14
      east_clear_ft: 10
      basis: "P2-A-302 Rev A 'as drawn' = P2-A-301 Rev A / B on the frozen Plan Rev D (14 in upper risers, 10 ft east focal); shown for comparison only"
      source: "phase2_sightlines.yaml cases.as_drawn (Rev A); phase2_plan_rev_d.yaml"
  figures:
