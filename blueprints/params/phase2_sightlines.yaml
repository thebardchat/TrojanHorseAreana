    - {case: drawn_e, side: E, title: "2  AS DRAWN (REV E) — EAST SIDE (seated eyes)", sub: "focal 16' (D-053) · upper 19\"/row · worst side", source: "phase2_plan_rev_e.yaml; D-053"}
    - {case: rev_d, side: E, title: "3  REV D BASIS (SUPERSEDED) — EAST SIDE (seated eyes)", sub: "focal 10' · upper 14\"/row, front 9.17' · P2-A-302 Rev A 'as drawn'", source: "P2-A-302 Rev A"}
  stack_sub: "3/16\" = 1'-0\" · recessed (Hussey) · N/S as drawn · dashed = Rev D 9.17' front"
  basis_change: "Rev A AS DRAWN (14 in / 10 ft east) is no longer drawn; Plan Rev E draws 19 in / 16 ft (D-053) = Rev A PROPOSED, so the 'as drawn' basis changed and the sheet is re-cased (values unchanged)"
  source: "Shane 2026-10-04 9:47 AM CT (A-302 Rev B only if the riser / east-clear change alters its 'as drawn' basis — it does); phase2_plan_rev_e.yaml"
