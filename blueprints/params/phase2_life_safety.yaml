# phase2_life_safety.yaml: P2-A-111 LIFE SAFETY PLAN (SCHEMATIC), Levels 1 + 2 (Phase 2). Read by phase2/src/p2_a_111.py.
# Rev A, 2026-10-04 (Shane 11:07 AM CT): exits with capacities and egress widths, occupant loads per P2-G-002 Rev A (worst case,
# standing floor), exit access travel distance and common path (measured on the diagram or TBD / UNVERIFIED), exit separation
# (1/3 diagonal, sprinklered), E1 8-pair door bank (Option 1 DECIDED). Geometry: params/phase2_plan_rev_g.yaml (Level 1 = P2-A-101
# Rev G; Level 2 = Rev F, unchanged). Loads and egress factors: params/phase2_code.yaml via p2_g_002.compute().
# Units: feet on plan (origin = SW building corner, x east, y north), inches for egress widths.
# Status: every travel path is a KEYSTONE diagram measurement (rectilinear, along open floor, LOW confidence) — UNVERIFIED until the
# architect lays out walls, doors, aisles and seating. Not a code review (D-008).

meta:
  sheet: P2-A-111
  title: "LIFE SAFETY PLAN (SCHEMATIC) — LEVELS 1 + 2"
  revision: A
  file: P2-A-111_RevA
  size: "17 x 11 in (tabloid), landscape"
  scale_ft_per_in: 50
  scale_text: "1\" = 50'-0\""
  disclaimer: "Schematic life safety diagram for the architect of record and the AHJ. Not a code review and no statement of approval; every line needs architect + AHJ confirmation (D-008). Door widths ASSUMED, travel paths measured on the diagram."
  source: "Shane 2026-10-04 11:07 AM CT (P2-A-111 Rev A: schematic set style, title block, PRELIMINARY stamp)"

