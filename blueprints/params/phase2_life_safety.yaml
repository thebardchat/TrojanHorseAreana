    - {id: T4, level: 2, label: "E upper tier, front row mid → aisle → loop → ST-2", pts: [[188, 140], [206.5, 140], [206.5, 246]], source: "KEYSTONE diagram measurement on plan Rev F L2 (UNVERIFIED; aisles not drawn)"}
    - {id: T5, level: 2, label: "S upper tier, front row mid → loop → upper concourse (E) → ST-3", pts: [[113, 56], [113, 37.5], [180, 37.5], [180, 6.3], [185.917, 6.3]], source: "KEYSTONE diagram measurement on plan Rev F L2 (UNVERIFIED)"}
    - {id: T6, level: 2, label: "S&C far corner → ST-1", pts: [[0.5, 141.7], [42.7, 141.7], [42.7, 227.917]], source: "KEYSTONE diagram measurement on plan Rev F L2 (UNVERIFIED; equipment layout TBD)"}
