  source: "P2-G-002 Rev A (Shane 10:48 AM CT); D-054 (OPEN, exits sized for the standing worst case: Shane 11:07 AM CT)"

exits:
  e1_from_plan: "E1 bank: params/phase2_plan_rev_g.yaml level_1.doors E1.bank (8 pairs x 64 in = 512 in clear, ASSUMED per pair)"
  door_rule: "capacity = clear width / 0.15 in per occupant (IBC 2021 1005.3.2 exception: sprinklered 903.3.1.1 + emergency voice / alarm 907.5.2.2)"
  stair_rule: "capacity = clear width / 0.2 in per occupant (IBC 2021 1005.3.1 exception 1)"
  checks: "1030.2 main exit >= 1/2 of the total occupant load; 1030.3 other exits on L1 >= 1/2 of the L1 load; 1005.3 total; 1005.5 lose any one exit >= 50 % of the required capacity"
  source: "R-015.6, R-018.2, R-007.3 (IBC 2021 1005.3.1, 1005.3.2, 1005.5, 1030.2, 1030.3; UpCodes, research_src/upc_ibc10.txt, retrieved 2026-10-04); Shane 11:07 AM CT (Option 1)"

