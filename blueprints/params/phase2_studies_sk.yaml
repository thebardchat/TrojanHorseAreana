  - {id: c, z: 24.42, title: "(c) stop at the stair (24.4 ft)", note: "L2 17.75 + 80 in headroom (IBC 2021 1011.3) + roof TBD. Only if no stair to the roof.", status: ASSUMED, source: "D-061 L2 FF + IBC 2021 1011.3 minimum headroom 80 in; roof structure depth TBD"}
roof_access:
  text: "Stair to the roof: IBC 2021 1011.12 requires it only for 4 or more stories above grade plane. This building has 2, so not by that section (verify with the AHJ, D-008). Rooftop equipment access: IMC 2021 306.5 (a permanent ladder may serve). TBD."
  source: "IBC 2021 1011.12; IMC 2021 306.5; D-008 AHJ OPEN"
