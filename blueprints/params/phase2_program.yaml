# phase2_program.yaml: P2-T-003b PROGRAM TEST-FIT inputs (Phase 2). Read by phase2/src/p2_g_003.py.
# A test-fit, NOT a floor plan and NOT a decision. Locked values (building, arena, seats, 5 SF tags)
# are read from phase2.yaml and never repeated here. Every factor carries `source`.
# Status words: CITED (a published source gives the number) · ASSUMED (KEYSTONE choice, verify) · TBD (no number; left out of totals).
# Confidence: HIGH / MEDIUM / LOW.

meta:
  ticket: P2-T-003b
  sheet: P2-G-003
  title: PROGRAM TEST-FIT
  subtitle: "AREA ARITHMETIC, NOT A PLAN"
  revision: A
  file: P2-G-003_RevA
  size: "17 x 11 in (tabloid), landscape"
  scale: NTS
  rule: one-level area arithmetic; no stacking (mezzanine, rooms under the seating bowl) is credited
  source: "Shane 2026-10-03 10:45 PM CT (P2-T-003b: area table, seating, fixtures, gross-up, fit check, options A/B/C, sheet P2-G-003)"

code_basis:
  edition_used: "IBC 2021 / IPC 2021 (per Shane 10:45 PM CT)"
  edition_conflict: "Madison County's building-codes page lists the 2018 IBC/IPC (effective Jan 2021) for county permits. AHJ is OPEN (D-008). The 2018 Table 2902.1 assembly row checked reads the same as 2021."
  assembly_section_2021: "IBC 2021 numbers the assembly egress section 1030 (it was 1029 in the 2018 edition)"
  occupancy_assumed: "A-4 (indoor arena with spectator seating) for the event bowl — ASSUMED pending R-007"
  source: "Shane 2026-10-03 10:45 PM CT; Madison County AL, Building Codes page (retrieved 2026-10-03); UpCodes IBC 2021 (Alabama) + IBC 2018 (Texas) text; R-009"

factors:
  gross_up:
    base: 1.25
    lean: 1.15
    base_basis: "+25% for walls, structure and circulation (Groton MA feasibility study, Reinhardt Assoc.); Loudoun County 2014 Recreation Center standard uses 80% efficiency (÷0.80 = ×1.25) for program space incl. gymnasium"
    lean_basis: "Loudoun County 2014 'Gross Building Area Allowance' 15% (walls/structure only); used as a LOW-end check that assumes the programmed concourse carries all circulation"
    status: CITED
    confidence: MEDIUM
    source: "R-014 (Loudoun County Capital Facilities Manual 2014 §4.3; Town of Groton MA Senior Center feasibility study)"
  mechanical:
    share_of_gross: 0.05
    basis: "HVAC equipment area 'typically 5 percent of gross floor space' (MIL-HDBK-1027/4A, in UFC 4-171-01N); electrical not separately sized"
    status: CITED
    confidence: LOW
    source: "R-014 (MIL-HDBK-1027/4A via UFC 4-171-01N); different building type (training facility)"
  seating:
    base_sf_per_seat: 6.0
    base_basis: "Loudoun County 2014 Recreation Center standard: spectator/team seating area per seat (elevated seating) = 6.0 SF/seat"
    lean_seat_width_in: 18
    lean_row_depth_in: 24
    lean_seats_between_aisles: 21
    lean_aisle_in: 48
    lean_basis: "telescopic bleacher geometry: 18 in per person (IBC 1004.6; Hussey net-capacity basis), 24 in row spacing (Hussey MAXAM standard option), 48 in stepped aisle with seats both sides (IBC 2021 1030.9.1), 21 seats max between aisles for 12 in accessway, seats without backrests (IBC 2021 1030.13.2.1). Excludes front walkway, cross aisles, wheelchair spaces."
    status: CITED (factors) / KEYSTONE arithmetic (lean geometry)
    confidence: MEDIUM
    source: "R-008"
  occupant_load:
    spectators: seats (IBC 2021 1004.6 fixed seating = number of seats)
    event_floor_sf_per_occupant: 50
    event_floor_basis: "IBC Table 1004.5 'Exercise rooms 50 gross' chosen for the competition floor — function choice ASSUMED (building official decides, 1004.5)"
    status: CITED factor / ASSUMED function
    confidence: MEDIUM
    source: "R-009 (IBC 2021 Table 1004.5, 1004.6)"
  restrooms:
    table: "IBC 2021 Table 2902.1, Assembly — coliseums, arenas … indoor sporting events"
    wc_male: "1 per 75 for the first 1,500 + 1 per 120 for the remainder"
    wc_female: "1 per 40 for the first 1,520 + 1 per 60 for the remainder"
    lav_male: "1 per 200"
    lav_female: "1 per 150"
    drinking_fountain: "1 per 1,000"
    service_sink: 1
    split: "occupant load divided in half (IBC 2902.1.1); fractions rounded up"
    urinals: "may replace up to 67% of required male water closets in assembly (IPC 2021 424.2)"
    sf_per_fixture: 50
    sf_per_fixture_status: ASSUMED
    sf_per_fixture_check: "a bare water-closet module from cited minimums is ~27 SF (36x60 in stall + 48 in aisle in front); 50 SF/fixture adds lavatory clear floor space, accessible stalls, entries and chases — ASSUMED, verify"
    counted_in_sf: [water closets incl. urinals, lavatories]
    not_in_sf: [drinking fountains (concourse alcoves), service sink (utility room, TBD)]
    confidence: "HIGH (fixture ratios) / LOW (SF per fixture)"
    source: "R-009 (IBC 2021 Table 2902.1, 2902.1.1, 2903.1.1; IPC 2021 424.2; ASI restroom layout guide for stall sizes)"

