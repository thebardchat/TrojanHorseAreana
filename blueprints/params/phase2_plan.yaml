# Locked program values (event floor SF, bowl seats, levels, room SF tags) live in phase2.yaml; program
# areas per room come from p2_testfit.compute_locked (P2-G-003 Rev D). This file holds coordinates only.
# Units: feet. Origin = SW corner of the building; x runs east, y runs north. Rectangles are [x0, y0, x1, y1].
# Status: every coordinate is ASSUMED (KEYSTONE layout choice, LOW confidence) unless a field says otherwise.

meta:
  ticket: P2-T-004
  sheets: [P2-A-101, P2-A-102]
  label: "SCHEMATIC — BLOCK PLAN"
  scale_ft_per_in: 32
  scale_text: "1/32 in = 1 ft-0 in"
  scale_basis: "at 1/16 in the 250 ft building is 15.6 in wide and does not fit the 17 x 11 in (tabloid) sheet body with a room schedule; 1/32 in = 7.8 in wide"
  north: "plan north = up, APPROXIMATE (matches the reference plan); site and true north TBD"
  reference: "Phase2-floor-plan-flat.png / arenav1-floor-plan.png (Shane): lockers west, arena east/center-right, entry + hall of champions on the south, stage on the west; locked program wins on conflicts"
  status: ASSUMED
  confidence: LOW
  source: "Shane 2026-10-03 11:39 PM CT (start P2-A-101 / P2-A-102 Rev A); KEYSTONE layout"

building:
  rect: [0, 0, 250, 220]
  basis: "250 ft E-W x 220 ft N-S = the 55,000 SF footprint cap exactly (D-031); a rectangle is the simplest outline that holds the 114 x 144 floor, three tiers and the west wing; shape is ASSUMED"
  status: ASSUMED
  confidence: LOW
  source: "KEYSTONE layout; phase2.yaml building.footprint_cap_sf (D-031)"

