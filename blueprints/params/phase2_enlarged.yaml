# phase2_enlarged.yaml: P2-A-401 ENLARGED PLANS — EVENT LOCKER ROOMS 1-4 (Phase 2, BACKLOG P2-T-010). Read by phase2/src/p2_a_401.py.
# Rev A, 2026-10-04 (Shane 11:24 AM CT): the 4 event locker rooms ONLY, 1/8" = 1'-0". The L1 public restroom core waits on D-064 (OPEN).
# Room envelopes come from params/phase2_plan_rev_g.yaml (evl_1..evl_4: 900 SF each = 3,600 SF total, D-060 settled; they run to the
# tier line under the upper tier, D-061). Layout inside each room is a KEYSTONE layout (ASSUMED); accessible fixture sizes and
# clearances are the ADA 2010 Standards minimums (cited per item, text from www.ada.gov, retrieved 2026-10-04,
# research_src/ada2010_v2.txt). Two templates: N (rooms 1-2, door on the side wall to the EXIT (N) passage; room 2 = mirror) and
# E (rooms 3-4, door on the end wall to the EXIT (E) passage; room 4 = mirror).
# Units: feet, local origin = SW corner of the template room, x east, y north (before mirroring). Rects are [x0, y0, x1, y1].

