  occupant_factor_sf: 50
  occupant_basis: "locker rooms 50 gross (IBC 2021 Table 1004.5) → 900 / 50 = 18 per room"
  headroom: "the 15 ft of each room nearest the arena lies under the upper tier: 7'-6\" clear at the tier line rising away from it (D-061; 1'-6\" structure ASSUMED, zero margin) — lockers 72 in and shower / toilet partitions fit"
  restroom_core: "L1 public restroom core NOT in this revision: waits on D-064 (OPEN: size for the worst case or limit the events)"
  source: "phase2_plan_rev_g.yaml; D-060 (3,600 SF settled), D-061 (front row 7'-6\" clear); IBC 2021 Table 1004.5 (R-007.2); Shane 11:24 AM CT"

rules:
  common_path:
    limit_ft: 75
    max_occupants: 49
    text: "one exit access doorway allowed when the space holds <= 49 occupants and the common path of egress travel is <= 75 ft (Group A, sprinklered)"
    measure: "rectilinear from the most remote point, through the inner doorways, to the room door; the common path ends at the room door because the exit passage offers two directions (exterior exit door, or vomitory to the event floor)"
    source: "IBC 2021 1006.2.1, Table 1006.2.1 (UpCodes, research_src/upc_ibc10.txt, retrieved 2026-10-04)"
  door:
    leaf_in: 36
    clear_in: 34
    text: "36 in leaf ≈ 34 in clear ≥ 32 in (ADA 404.2.3; IBC 1010.1.1); swings INTO the room so the 8 ft exit passage stays clear — allowed below 50 occupants (IBC 1010.1.2.1) with a 30 x 48 in space beyond the swing (ADA 803.3); pull-side maneuvering 60 in perpendicular + 18 in beyond the latch (ADA Table 404.2.4.1)"
    source: "ADA 2010 404.2.3, 404.2.4.1, 803.3; IBC 2021 1010.1.1, 1010.1.2.1"
  lockers:
    width_in: 15
    depth_in: 18
    height_in: 72
    accessible_pct: 5
    text: "15 x 18 x 72 in single-tier lockers ASSUMED; at least 5 % (min. 1) accessible: storage within 15-48 in reach (ADA 225.2.1, 811, 308.2.1), 30 x 48 in clear floor (305.3)"
    source: "ADA 2010 225.2.1, 811.2, 811.3, 308.2.1, 305.3; locker size ASSUMED (KEYSTONE)"
  benches:
    text: "freestanding team benches 18 in deep ASSUMED; one accessible bench per room: 24 x 48 in seat, 17-19 in high, affixed to a wall (back support), 30 x 48 in clear floor at its end parallel to its short axis (ADA 803.4, 903.2-903.5)"
    source: "ADA 2010 222.1, 803.4, 903.2, 903.3, 903.4, 903.5; team bench size ASSUMED"
  toilets:
    text: "2 WC per room ASSUMED: 1 wheelchair compartment 60 x 60 in (≥ 60 x 59 floor-mounted, 604.8.1.1; WC centerline 18 in from the side wall, 604.2; door in the front partition at the far side, 604.8.1.2) + 1 ambulatory compartment 36 x 60 in (35-37 x ≥ 60, 604.8.2.1; not required below 6 compartments, 213.3.1, provided ASSUMED); 2 lavatories, 1 with forward-approach 30 x 48 in clear floor + knee / toe clearance, rim ≤ 34 in (606.2, 606.3); 60 in turning circle (304.3.1); no urinals (rooms serve either team / sex, ASSUMED)"
    source: "ADA 2010 213.3.1, 304.3.1, 604.2, 604.8.1.1, 604.8.1.2, 604.8.2.1, 606.2, 606.3; fixture count ASSUMED"
  showers:
    text: "4 showers per room ASSUMED: 1 standard roll-in 30 x 60 in inside with a 60 in entry and a 30 x 60 in clearance at the open face (608.2.2, 608.2.2.1) = the accessible shower (213.3.6); 3 stalls 36 x 36 in (transfer size, 608.2.1)"
    source: "ADA 2010 213.3.6, 608.2.1, 608.2.2, 608.2.2.1; count ASSUMED"
  accessible_route:
    text: "36 in min clear width along the locker aisles and to every accessible element (ADA 403.5.1)"
    source: "ADA 2010 403.5.1"
  source: "ADA 2010 Standards (DOJ, www.ada.gov, retrieved 2026-10-04); IBC 2021 Ch. 10 (UpCodes); KEYSTONE assumptions as marked"

