    - {id: evl_2, template: N, mirror: x, door_to: "EXIT (N) passage → X5 north / V1 to the floor", exit: X5, source: "plan Rev G evl_2 [131.85, 224, 163.99, 252]"}
    - {id: evl_3, template: E, mirror: none, door_to: "EXIT (E) passage → X7 east / V2 to the floor", exit: X7, source: "plan Rev G evl_3 [188, 183.09, 210, 224]"}
