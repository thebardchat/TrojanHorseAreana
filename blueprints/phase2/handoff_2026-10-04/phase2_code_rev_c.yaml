    not_permitted: "standing (not a design use, D-054); anything larger than chairs-only needs temporary restroom units (D-064)"
    source: "IBC 2021 1004.9 (R-007.5, research_src/upc_ibc10.txt); Shane 2026-10-04 1:22 PM CT (D-054, D-064)"
  source: "R-007.2; D-054; Shane 2026-10-04 10:48 AM CT + 1:22 PM CT"

