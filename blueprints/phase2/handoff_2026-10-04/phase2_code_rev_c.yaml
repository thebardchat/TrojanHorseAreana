  margin_case: standing
  design_rule: "D-054 DECIDED (Shane 1:22 PM CT): event floor = CHAIRS-ONLY (7 net): graduations, banquets, expos; no standing-concert design. L1 exits stay as drawn for standing (extra margin, no change)"
  posted:
    rule: "IBC 2021 1004.9: the occupant load of a Group A room or space shall be posted in a conspicuous place near the main exit or exit access doorway; one sign per configuration (D-064 Option 2)"
