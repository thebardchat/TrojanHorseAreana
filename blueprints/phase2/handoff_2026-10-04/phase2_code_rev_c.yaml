fire_protection:
  items:
    - "Automatic sprinklers throughout (903.3.1.1, ASSUMED): 903.2.1.4 triggers for A-4 — fire area > 12,000 SF, occupant load >= 300, floor other than exit discharge; all three met (R-015.5)."
    - "Emergency voice/alarm (907.2.1.1: Group A, occupant load >= 1,000; 907.5.2.2) ASSUMED (R-015.5)."
    - "Sprinklers + voice alarm allow 0.2 in/occupant for stairs (1005.3.1 exc. 1) and 0.15 in for doors and other components (1005.3.2 exc.) (R-018.2, R-015.6)."
    - "Smoke-protected seating NOT assumed (1030.6.2 needs smoke control per 909 + a life safety evaluation; NFPA 101 not reviewed). If used: 1030.6.2.2 roof >= 15' above the highest aisle (loop 17.75') = 32.75'; arena U/S structure 36' drawn (R-022 §5)."
    - "Group A: post the occupant load (1004.9); fire safety + evacuation plan with a seating plan (IFC 403.2.1); telescopic seating per ICC 300 (1030.1.1) (R-007.2)."
  source: "R-015.5, R-015.6, R-018.2, R-007.2, R-022 §5"

